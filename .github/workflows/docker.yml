name: Docker image

# Builds the image and publishes it to the GitHub Container Registry:
#   ghcr.io/<owner>/recipe-bridge:latest      - every push to main
#   ghcr.io/<owner>/recipe-bridge:1.2.0, :1.2 - a version tag like v1.2.0
# Pull requests only build it (amd64, not published) to catch Dockerfile
# problems early.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: ["backend/Dockerfile", "backend/requirements.txt", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    # runs after the tests passed - or right away for a pull request
    if: always() && (needs.test.result == 'success' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/recipe-bridge
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Recipe Bridge
            org.opencontainers.image.description=Imports recipes into Tandoor or Mealie with AI, keeps the collection tidy and plans meals.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
