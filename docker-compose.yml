# Recipe Bridge - uses the ready-made image. Put this file and your .env
# (a copy of .env.example) into one folder, then: docker compose up -d
# Update: docker compose pull && docker compose up -d
# To build the image yourself from a clone instead, see docker-compose.build.yml.
services:
  recipe-bridge:
    image: ghcr.io/carllvin/recipe-bridge:latest   # or a fixed version, e.g. :1.0
    container_name: recipe-bridge
    restart: unless-stopped
    ports:
      - "8420:8000"
    # All settings come from .env (see .env.example); anything left out
    # uses its default.
    env_file: .env
    volumes:
      - recipe_bridge_data:/app/data
      # Watched folder: uncomment and set WATCH_DIR=/app/import in .env -
      # files put into ./import are imported on their own.
      # - ./import:/app/import
    # The image has a health check - `docker compose ps` shows healthy/unhealthy.

volumes:
  recipe_bridge_data:
    # A fixed name, independent of the folder. Coming from "Tandoor Helper"?
    # The README (Updating) shows how to move the old data.
    name: recipe_bridge_data
