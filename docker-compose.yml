services:
  tandoor-helper:
    build: ./backend
    container_name: tandoor-helper
    restart: unless-stopped
    ports:
      - "8420:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-6}
      CLAUDE_TOOLS_MODEL: ${CLAUDE_TOOLS_MODEL:-claude-haiku-4-5-20251001}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_TOOLS_MODEL: ${OPENAI_TOOLS_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TOOLS_MODEL: ${GEMINI_TOOLS_MODEL:-}
      TANDOOR_URL: ${TANDOOR_URL}
      TANDOOR_TOKEN: ${TANDOOR_TOKEN}
      OUTPUT_LANGUAGE: ${OUTPUT_LANGUAGE:-English}
      CONVERT_TO_METRIC: ${CONVERT_TO_METRIC:-true}
      CHECK_DUPLICATES: ${CHECK_DUPLICATES:-true}
      REUSE_EXISTING_TAGS: ${REUSE_EXISTING_TAGS:-true}
      CUSTOM_INSTRUCTIONS: ${CUSTOM_INSTRUCTIONS:-}
      TOC_AWARE_CHUNKING: ${TOC_AWARE_CHUNKING:-false}
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-48}
      AUTO_PROCESS_INTERVAL_HOURS: ${AUTO_PROCESS_INTERVAL_HOURS:-0}
      TZ: ${TZ:-UTC}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng}
      OCR_MIN_CHARS_PER_PAGE: ${OCR_MIN_CHARS_PER_PAGE:-20}
      OCR_DPI: ${OCR_DPI:-300}
      OCR_PREPROCESS_ENABLED: ${OCR_PREPROCESS_ENABLED:-true}
      OCR_DOUBLE_PAGE_DETECTION: ${OCR_DOUBLE_PAGE_DETECTION:-true}
      OCR_DOUBLE_PAGE_ASPECT_THRESHOLD: ${OCR_DOUBLE_PAGE_ASPECT_THRESHOLD:-1.3}
      FORCE_OCR: ${FORCE_OCR:-false}
      IMAGE_GEN_ENABLED: ${IMAGE_GEN_ENABLED:-false}
      IMAGE_GEN_PROVIDER: ${IMAGE_GEN_PROVIDER:-openai}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      IMAGE_GEN_CUSTOM_INSTRUCTIONS: ${IMAGE_GEN_CUSTOM_INSTRUCTIONS:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - tandoor_helper_data:/app/data
    # Defined in the Dockerfile (HEALTHCHECK instruction); shown here only as a
    # reminder that `docker compose ps` will report healthy/unhealthy for this
    # service. Override interval/timeout/retries here if you need to.

volumes:
  tandoor_helper_data:
